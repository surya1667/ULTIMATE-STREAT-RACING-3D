name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -o Street_Racing_Android_Source.zip -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -type f | head -n 1)")
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Android app module was not found in the source ZIP."
            find extracted -maxdepth 5 -type f
            exit 1
          fi
          cp -R "$PROJECT_DIR"/. .

      - name: Verify game source files
        run: |
          test -s app/build.gradle
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/ultimatestreetracing/game/MainActivity.java
          echo "Game source files are present."
          wc -c app/src/main/assets/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Verify APK contents
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          echo "APK size:"
          du -h "$APK"
          echo "APK contents:"
          unzip -Z1 "$APK" | head -n 40
          unzip -Z1 "$APK" | grep -Fx 'assets/index.html'
          unzip -Z1 "$APK" | grep -Fx 'classes.dex'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Street-Racing-3D-APK
          path: app/build/outputs/apk/debug/*.apk
